<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CinePedia - Acceso</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="encabezado"><h2 class="logo">CinePedia</h2></header>
  {% with mensajes = get_flashed_messages() %}
    {% if mensajes %}<div class="mensajes">{% for mensaje in mensajes %}<p>{{ mensaje }}</p>{% endfor %}</div>{% endif %}
  {% endwith %}
  <main class="contenido">
    <section class="tarjeta">
      <h1>Registro</h1>
      <form action="{{ url_for('auth.register') }}" method="post">
        <label>Nombre</label><input name="nombre" required>
        <label>Apellido</label><input name="apellido" required>
        <label>E-mail</label><input type="email" name="email" required>
        <label>Contraseña</label><input type="password" name="password" required>
        <label>Conf. Contraseña</label><input type="password" name="confirmar_password" required>
        <button>Registrar</button>
      </form>
    </section>
    <section class="tarjeta">
      <h1>Inicio de Sesión</h1>
      <form action="{{ url_for('auth.login') }}" method="post">
        <label>E-mail</label><input type="email" name="email" required>
        <label>Contraseña</label><input type="password" name="password" required>
        <button>Iniciar Sesión</button>
      </form>
    </section>
  </main>
</body>
</html>
